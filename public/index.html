<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HHGOA Fraud Investigator</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root { --primary: #2563eb; --surface: #ffffff; --bg: #f8fafc; --text: #1e293b; --text-light: #64748b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 30px; color: var(--text); line-height: 1.6; }
        .container { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .header { text-align: center; margin-bottom: 10px; }
        h1 { margin: 0; color: #0f172a; font-size: 28px; }
        h2 { font-size: 18px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        h3 { font-size: 14px; color: var(--text-light); text-transform: uppercase; margin-top: 24px; margin-bottom: 8px; letter-spacing: 0.5px; }
        .card { background: var(--surface); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #e2e8f0; }
        .input-group { display: flex; gap: 12px; justify-content: center; }
        input[type="text"] { padding: 12px 16px; width: 350px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: var(--primary); }
        button { padding: 12px 24px; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: background-color 0.2s; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #network { height: 400px; border: 1px solid #e2e8f0; background-color: #f8fafc; border-radius: 8px; margin-top: 10px; }
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .log { background: #0f172a; color: #e2e8f0; padding: 16px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; height: 250px; overflow-y: auto; border-radius: 8px; line-height: 1.5; border-left: 4px solid var(--primary); }
        .log div { margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .log div:last-child { border-bottom: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; color: var(--text); }
        td strong { color: var(--text-light); font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 0.5px; }
        .bg-red { background-color: #ef4444; }
        .bg-green { background-color: #10b981; }
        .bg-gray { background-color: #64748b; }
        #outExplanation, #outEvidence { background: #f1f5f9; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; color: #334155; }
        #outEvidence ul { padding-left: 20px; margin: 0; }
        #outEvidence li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HHGOA Fraud Investigator</h1>
            <p>Graph-powered fraud investigation</p>
        </div>

        <div class="card">
            <div class="input-group">
                <input type="text" id="txnId" placeholder="Enter Transaction ID (e.g. 2987004)" value="2987004">
                <button id="investigateBtn" onclick="investigate()">INVESTIGATE</button>
            </div>
            <p id="loadingMsg" class="hidden" style="text-align: center; font-weight: bold; margin-top: 15px; color: #0066cc;">Investigating transaction...</p>
            <p id="errorMsg" class="hidden" style="text-align: center; font-weight: bold; margin-top: 15px; color: #dc3545;"></p>
        </div>

        <div id="resultsArea" class="hidden">
            <div class="grid">
                <!-- Left Column: Investigation Summary -->
                <div class="card">
                    <h2>INVESTIGATION RESULT</h2>
                    <div style="margin-bottom: 15px;">
                        <strong>Risk Level:</strong> <span id="outVerdict" class="badge bg-gray"></span><br>
                        <strong>Risk Score:</strong> <span id="outProbability"></span><br>
                        <strong>Status:</strong> <span id="outStatus"></span>
                    </div>
                    
                    <h3>Detected Patterns</h3>
                    <ul id="outPatterns" style="font-size: 14px;"></ul>

                    <h3>Explanation</h3>
                    <p id="outExplanation" style="white-space: pre-wrap; font-size: 14px;"></p>
                    
                    <h3>Agent Decision Log</h3>
                    <div class="log" id="outLog"></div>
                </div>

                <!-- Right Column: Graph & Transaction -->
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <div class="card">
                        <h2>TRANSACTION DETAILS</h2>
                        <div style="overflow-x: auto;">
                            <table id="txnTable" style="font-size: 14px;">
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card">
                        <h2>FRAUD NETWORK</h2>
                        <div id="network"></div>
                    </div>

                    <div class="card">
                        <h2>EVIDENCE / CONNECTED ENTITIES</h2>
                        <div id="outEvidence" style="font-size: 14px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Colors mapping for nodes
        const typeColors = {
            'Customer': '#4caf50',
            'Card': '#2196f3',
            'Transaction': '#ff9800',
            'DeviceProfile': '#9c27b0',
            'EmailDomain': '#e91e63',
            'BillingRegion': '#00bcd4',
            'ClosedCase': '#f44336'
        };

        async function investigate() {
            const txnId = document.getElementById('txnId').value.trim();
            if (!txnId) return;

            // UI State updates
            document.getElementById('investigateBtn').disabled = true;
            document.getElementById('loadingMsg').classList.remove('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('resultsArea').classList.add('hidden');

            try {
                // Run the API call
                const response = await fetch('/api/investigate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transaction_id: txnId })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Investigation failed');
                }

                const data = await response.json();
                
                // Also fetch graph and txn details concurrently
                const [graphRes, txnRes] = await Promise.all([
                    fetch('/api/graph/' + txnId),
                    fetch('/api/transaction/' + txnId)
                ]);
                
                const graphData = graphRes.ok ? await graphRes.json() : null;
                const txnData = txnRes.ok ? await txnRes.json() : null;

                renderResults(data, graphData, txnData);

            } catch (err) {
                document.getElementById('errorMsg').textContent = err.message;
                document.getElementById('errorMsg').classList.remove('hidden');
            } finally {
                document.getElementById('investigateBtn').disabled = false;
                document.getElementById('loadingMsg').classList.add('hidden');
            }
        }

        function renderResults(data, graphData, txnData) {
            document.getElementById('resultsArea').classList.remove('hidden');
            
            // Render basic summary
            const verdictEl = document.getElementById('outVerdict');
            verdictEl.textContent = data.verdict.toUpperCase();
            if (data.verdict.toLowerCase() === 'fraud') verdictEl.className = 'badge bg-red';
            else if (data.verdict.toLowerCase() === 'legitimate') verdictEl.className = 'badge bg-green';
            else verdictEl.className = 'badge bg-gray';

            document.getElementById('outStatus').textContent = data.status.toUpperCase();
            document.getElementById('outProbability').textContent = (data.fraud_probability * 100).toFixed(1) + '%';
            document.getElementById('outExplanation').textContent = data.explanation || 'No explanation provided.';

            // Render Patterns
            const patUl = document.getElementById('outPatterns');
            patUl.innerHTML = '';
            if (data.detected_patterns && data.detected_patterns.length > 0) {
                data.detected_patterns.forEach(p => {
                    const li = document.createElement('li');
                    li.textContent = p;
                    patUl.appendChild(li);
                });
            } else {
                patUl.innerHTML = '<li>None</li>';
            }

            // Render Evidence
            const evDiv = document.getElementById('outEvidence');
            evDiv.innerHTML = '';
            if (data.evidence && data.evidence.length > 0) {
                const ul = document.createElement('ul');
                data.evidence.forEach(e => {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>${e.source}:</strong> ${e.claim}`;
                    ul.appendChild(li);
                });
                evDiv.appendChild(ul);
            } else {
                evDiv.textContent = 'No evidence recorded.';
            }

            // Render Log
            const logEl = document.getElementById('outLog');
            logEl.innerHTML = '';
            if (data.decision_log) {
                data.decision_log.forEach(entry => {
                    const div = document.createElement('div');
                    div.style.marginBottom = '5px';
                    div.textContent = `[${entry.node_name}] ${entry.rationale}`;
                    logEl.appendChild(div);
                });
            }

            // Render Transaction
            const tbody = document.querySelector('#txnTable tbody');
            tbody.innerHTML = '';
            if (txnData) {
                // Pick requested keys if they exist
                const keys = ['TransactionID', 'TransactionAmt', 'ProductCD', 'customer_id', 'card1', 'DeviceInfo', 'P_emaildomain', 'addr1'];
                const labels = ['Transaction ID', 'Amount', 'Product', 'Customer', 'Card', 'Device', 'Email', 'Billing Region'];
                
                keys.forEach((key, idx) => {
                    const val = txnData[key];
                    if (val !== undefined && val !== null) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td><strong>${labels[idx]}</strong></td><td>${val}</td>`;
                        tbody.appendChild(tr);
                    }
                });
            }

            // Render Graph
            if (graphData && graphData.raw) {
                drawGraph(graphData.raw);
            }
        }

        function drawGraph(raw) {
            // Convert tigergraph raw dict into vis-network nodes and edges
            const nodes = new vis.DataSet();
            const edges = new vis.DataSet();
            const addedNodes = new Set();
            
            // The structure is generally nested dicts based on get_neighborhood
            // Example TigerGraph query format:
            // "results": [{"txn": {"v_id": "...", "v_type": "Transaction", "attributes": {...}}}]
            // Let's recursively find anything that looks like a vertex or edge
            
            function processElement(el) {
                if (!el || typeof el !== 'object') return;
                
                // If it looks like a vertex
                if (el.v_id && el.v_type) {
                    if (!addedNodes.has(el.v_id)) {
                        addedNodes.add(el.v_id);
                        nodes.add({
                            id: el.v_id,
                            label: el.v_type + '\\n' + el.v_id,
                            color: typeColors[el.v_type] || '#999',
                            shape: 'box',
                            font: { color: 'white' }
                        });
                    }
                }
                
                // If it looks like an edge
                if (el.e_type && el.from_id && el.to_id) {
                    edges.add({
                        from: el.from_id,
                        to: el.to_id,
                        label: el.e_type,
                        font: { size: 10, align: 'middle' },
                        arrows: 'to'
                    });
                }
                
                // Recursively search arrays and objects
                if (Array.isArray(el)) {
                    el.forEach(processElement);
                } else {
                    Object.values(el).forEach(processElement);
                }
            }
            
            processElement(raw);
            
            // Create network
            const container = document.getElementById('network');
            const data = { nodes, edges };
            const options = {
                physics: {
                    stabilization: false,
                    barnesHut: {
                        gravitationalConstant: -2000,
                        springConstant: 0.04,
                        springLength: 95
                    }
                }
            };
            new vis.Network(container, data, options);
        }
    </script>
</body>
</html>
